name: GPU Simulator diag

on:
  push:
    branches: [ diag-gpu-sim ]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pantheongpu/setup-pantheonsim@ab71a07326835be678918901c340d53a83358067 # v0.1.6
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.1"
      - name: repro
        working-directory: repro
        run: |
          for x in clampf clamp; do
            hipcc -O3 --offload-arch=gfx942 --save-temps -c $x.cpp -o $x.o 2>/dev/null; grep -n "clamp$" $x-hip-amdgcn-amd-amdhsa-gfx942.s
            hipcc -O3 --offload-arch=gfx942 $x.cpp -o $x; vgpu run ./$x || true
          done
          exit 0
          hipcc -O3 --offload-arch=gfx942 --save-temps -c clamp.cpp -o c.o 2>/dev/null
          echo "--- clamp.s"; sed -n '/^_Z1kPKdS0_Pd:/,/s_endpgm/p' clamp-hip-amdgcn-amd-amdhsa-gfx942.s
          hipcc -O3 --offload-arch=gfx942 clamp.cpp -o clamp
          vgpu run ./clamp || true
          hipcc -O3 --offload-arch=gfx942 --save-temps -c mindist.cpp -o md.o 2>/dev/null
          echo "--- clamp lines in mindist"; grep -n "clamp\|v_max_f64\|v_min_f64\|v_med3" mindist-hip-amdgcn-amd-amdhsa-gfx942.s
