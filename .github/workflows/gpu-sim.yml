name: "GPU Simulator"

# The repository has no CI yet. This workflow builds ExaDiS with Kokkos HIP for
# gfx942 and runs tests/unit_tests/run_tests.py (C++ tests, the Python module
# and the examples) on a simulated AMD Instinct MI300X
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "python/**"
      - "tests/**"
      - "examples/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hip-unit-tests:
    name: "unit tests (Kokkos HIP and simulated MI300X)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@656f502ef4782d94d34d8ddd368e333960609639 # v0.1.8
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.1"

      # comgr for find_package(hip), rocFFT/hipFFT for the FFT force module,
      # rocThrust/rocPRIM for Kokkos, and Python with NumPy and matplotlib for
      # pyexadis and the Python tests.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y comgr hipfft-dev rocfft-dev rocprim-dev rocthrust-dev \
            python3-dev python3-numpy python3-matplotlib

      # Same settings as cmake/sys.cmake.tuo, for the discrete MI300X (gfx942).
      - name: Configure
        run: cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=hipcc
          -DKokkos_ENABLE_HIP=ON
          -DKokkos_ENABLE_OPENMP=OFF
          -DKokkos_ENABLE_HIP_MULTIPLE_KERNEL_INSTANTIATIONS=ON
          -DKokkos_ARCH_AMD_GFX942=ON
          -DEXADIS_USE_COMPUTE_MAPS=ON
          -DEXADIS_BUILD_TESTS=ON
          -DPYTHON_EXECUTABLE=/usr/bin/python3

      - name: Build
        run: cmake --build build -j3

      # run_tests.py gives each test 30 s, which is enough on a GPU but not on
      # the simulator, so the limit is raised to 30 min in the checked-out copy
      # here (the whole suite takes about 6 min on the simulator).
      - name: Run unit tests
        working-directory: tests/unit_tests
        run: |
          sed -i 's/timeout=30)/timeout=1800)/' run_tests.py
          grep -q "timeout=1800)" run_tests.py
          vgpu run python3 run_tests.py --noplot --build_path=../../build
